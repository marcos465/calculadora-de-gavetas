<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MarcenariaCalc - Calculadora automatizada de plano de corte e lista de ferragens para balcões e móveis de marcenaria.">
    <title>MarcenariaCalc - Calculadora de Plano de Corte e Ferragens</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1 class="app-title">🪚 MarcenariaCalc</h1>
            <p class="app-subtitle">Gerador de Plano de Corte e Lista de Ferragens</p>
        </div>
    </header>

    <main class="app-main">
        <!-- Contêiner do formulário de triagem e parâmetros do móvel -->
        <section id="formContainer" class="form-region">
            <div class="card">
                <h2 class="card-title">Triagem do Móvel</h2>
                <form id="furniture-form" class="furniture-form">
                    <fieldset class="form-group-group">
                        <legend>Dimensões Totais do Balcão (mm)</legend>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="width">Largura (mm):</label>
                                <input type="number" id="width" name="width" min="100" max="5000" step="1" required placeholder="Ex: 1200">
                            </div>
                            <div class="form-group">
                                <label for="height">Altura (mm):</label>
                                <input type="number" id="height" name="height" min="100" max="3000" step="1" required placeholder="Ex: 850">
                            </div>
                            <div class="form-group">
                                <label for="depth">Profundidade (mm):</label>
                                <input type="number" id="depth" name="depth" min="100" max="1500" step="1" required placeholder="Ex: 600">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="form-group-group">
                        <legend>Especificações do Material</legend>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="mdfThickness">Espessura Caixa (mm):</label>
                                <select id="mdfThickness" name="mdfThickness" required>
                                    <option value="15" selected>15 mm</option>
                                    <option value="18">18 mm</option>
                                    <option value="25">25 mm</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="backPanelThickness">Espessura Fundo (mm):</label>
                                <select id="backPanelThickness" name="backPanelThickness" required>
                                    <option value="3" selected>3 mm</option>
                                    <option value="6">6 mm</option>
                                </select>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="form-group-group">
                        <legend>Divisões Internas e Portas</legend>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="doorsQuantity">Quantidade de Portas:</label>
                                <input type="number" id="doorsQuantity" name="doorsQuantity" min="0" max="10" step="1" value="2" required>
                            </div>
                            <div class="form-group">
                                <label for="shelvesQuantity">Quantidade de Prateleiras:</label>
                                <input type="number" id="shelvesQuantity" name="shelvesQuantity" min="0" max="10" step="1" value="1" required>
                            </div>
                            <div class="form-group">
                                <label for="drawersQuantity">Quantidade de Gavetas:</label>
                                <input type="number" id="drawersQuantity" name="drawersQuantity" min="0" max="10" step="1" value="0" required>
                            </div>
                        </div>
                    </fieldset>

                    <div class="form-actions">
                        <button type="submit" id="btnCalculate" class="btn btn-primary btn-lg">
                            📐 Calcular Plano de Corte
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Contêiner de resultados para injeção da lista de corte e ferragens via CutListUI -->
        <section id="resultContainer" class="result-region"></section>
    </main>

    <footer class="app-footer">
        <div class="footer-container">
            <p>&copy; MarcenariaCalc - Ferramenta open-source para marcenaria sob medida.</p>
        </div>
    </footer>

    <!-- Ponto de entrada modular ES6 -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
